<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Truyện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/manga-list.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <a href="index.html" class="logo">Manga<span style="color: #fff;">Hub</span></a>
        <div class="search-box">
            <input type="text" placeholder="Tìm kiếm...">
            <i class="fas fa-search"></i>
        </div>
        <div class="user-actions">
            <a href="login.html">Đăng Nhập</a>
        </div>
    </header>

    <div class="container" style="margin-top: 100px;">
        
        <!-- Bộ lọc -->
        <div class="filter-section">
            <div class="row align-items-center">
                <div class="col-md-8 filter-controls">
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-outline-danger active">Tất Cả</button>
                        <button type="button" class="btn btn-outline-danger">Hoàn Thành</button>
                        <button type="button" class="btn btn-outline-danger">Đang Tiến Hành</button>
                    </div>
                    <div class="btn-group ms-2" role="group">
                        <button type="button" class="btn btn-outline-secondary">Mới Nhất</button>
                        <button type="button" class="btn btn-outline-secondary">Xem Nhiều</button>
                    </div>
                </div>
                <div class="col-md-4 text-end">
                    <select class="form-select w-auto d-inline-block">
                        <option>Tất cả thể loại</option>
                        <option>Hành động</option>
                        <option>Ngôn tình</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Lưới truyện -->
        <div class="manga-list-grid">
            <!-- Item -->
            <div class="manga-list-item">
                <a href="detail.html">
                    <img src="https://placehold.co/200x280" class="manga-cover" alt="Cover">
                </a>
                <div class="manga-info">
                    <h3 class="manga-title"><a href="detail.html" class="text-dark text-decoration-none">Chàng Rể Mạnh Nhất Lịch Sử</a></h3>
                    <div class="rating">
                        <i class="fas fa-star stars"></i>
                        <span class="rating-number">4.8</span>
                    </div>
                    <div class="chapter-updates">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="chapter">Chương 100</span>
                            <span class="update-time">10 phút trước</span>
                        </div>
                    </div>
                </div>
            </div>
             <!-- Item -->
             <div class="manga-list-item">
                <a href="detail.html">
                    <img src="https://placehold.co/200x280" class="manga-cover" alt="Cover">
                </a>
                <div class="manga-info">
                    <h3 class="manga-title"><a href="detail.html" class="text-dark text-decoration-none">Võ Luyện Đỉnh Phong</a></h3>
                    <div class="rating">
                        <i class="fas fa-star stars"></i>
                        <span class="rating-number">4.5</span>
                    </div>
                    <div class="chapter-updates">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="chapter">Chương 3500</span>
                            <span class="update-time">Vừa xong</span>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Copy ra nhiều item để thấy hiệu ứng grid -->
        </div>

        <!-- Phân trang -->
        <ul class="pagination">
            <li class="page-item disabled"><a class="page-link" href="#">Trước</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Sau</a></li>
        </ul>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
