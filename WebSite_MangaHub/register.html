<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/css-login-register.css">
</head>
<body>
    
    <!-- Hình nền bên trái -->
    <div class="bg-img" style="background-image: url('https://placehold.co/1920x1080/1e3c72/FFF?text=Manga+World');"></div>

    <!-- Form bên phải -->
    <div class="form-wrap d-flex align-items-center justify-content-center">
        <div class="w-100" style="max-width: 450px;">
            <h2 class="title mb-5">Đăng Ký</h2>
            
             <form id="registerForm">

                <div class="form-floating">
                    <input type="email" id="regEmail" class="form-control">
                    <label for="floatingInput">Email của bạn</label>
                </div>
                
                <div class="form-floating">
                    <span class="password-show-toggle"><span class="uil"></span></span>
                    <input type="password" id="regPassword" class="form-control">
                    <label for="floatingPassword">Mật khẩu</label>
                </div>

                <div class="form-floating">
                    <span class="password-show-toggle"><span class="uil"></span></span>
                    <input type="password" id="regConfirm" class="form-control">
                    <label for="floatingPassword">Nhập lại mật khẩu</label>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            Ghi nhớ mật khẩu
                        </label>
                    </div>
                    <!-- <div><a href="#">Quên mật khẩu?</a></div> -->
                </div>

                <div class="d-grid mb-4">
                    <button type="submit" class="btn btn-primary">Đăng Ký Ngay</button>
                </div>

                <div class="mb-4 text-center">
                    Đã có tài khoản? <a href="./login.html">Đăng Nhập</a>
                </div>

                <div class="social-account-wrap">
                    <h4><span>Hoặc đăng nhập với</span></h4>
                    <ul class="list-unstyled social-account d-flex justify-content-between mt-4">
                        <li><a href="#"><img src="https://img.icons8.com/color/48/000000/google-logo.png" alt="Google" width="30"></a></li>
                        <li><a href="#"><img src="https://img.icons8.com/color/48/000000/facebook-new.png" alt="Facebook" width="30"></a></li>
                        <li><a href="#"><img src="https://img.icons8.com/color/48/000000/twitter--v1.png" alt="Twitter" width="30"></a></li>
                        <li><a href="#"><img src="https://img.icons8.com/ios-filled/50/000000/mac-os.png" alt="Apple" width="30"></a></li>
                    </ul>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
