<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - MangaHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand"> Admin MangaHub</span>
    <div>
        <a href="index.html" class="btn btn-outline-light btn-sm me-2">
            <i class="fas fa-home"></i> Trang chủ
        </a>
        <button class="btn btn-danger btn-sm" onclick="logout()">Đăng xuất</button>
    </div>
</nav>

<div class="container my-4">

    <!-- FORM -->
    <div class="card shadow mb-4">
        <div class="card-header bg-primary text-white">
            <span id="formTitle"><i class="fas fa-plus"></i> Thêm truyện</span>
        </div>
        <div class="card-body">
        <form id="mangaForm" class="row g-3">

            <div class="col-md-4">
                <label class="form-label">Tên truyện</label>
                <input type="text" id="title" class="form-control" required>
            </div>
            
             <div class="col-md-2">
                <label class="form-label">Số chương</label>
                <input type="number" id="chapterCount" class="form-control" min="1" required>
            </div>

            <div class="col-md-4">
                <label class="form-label">Thể loại</label>
                <select id="category" class="form-select" required>
                    <option value="">-- Chọn thể loại --</option>
                    <option>Action</option>
                    <option>Adventure</option>
                    <option>Fantasy</option>
                    <option>Romance</option>
                    <option>Horror</option>
                    <option>Comedy</option>
                    <option>Isekai</option>
                    <option>Manhwa</option>
                    <option>Manhua</option>
                    <option>Manga</option>
                    <option>School Life</option>
                    <option>Drama</option>
                    <option>Martial Arts</option>
                    <option>Supernatural</option>
                    <option>Psychological</option>
                    <option>Magic</option>
                    <option>Manhga</option>
                </select>
            </div>

            <div class="col-md-4">
                <label class="form-label">Link ảnh</label>
                <input type="text" id="image" class="form-control" required>
            </div>

            <div class="col-12">
                <label class="form-label">Mô tả</label>
                <textarea id="description" class="form-control" rows="3" required></textarea>
            </div>

            <div class="col-12">
                <button class="btn btn-success">
                    <i class="fas fa-save"></i> Lưu
                </button>
            </div>

</form>

        </div>
    </div>

    <!-- TABLE -->
    <div class="card shadow">
        <div class="card-header bg-secondary text-white">
            <i class="fa-solid fa-table-list"> </i>Danh sách truyện
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Ảnh</th>
                        <th>Tên</th>
                        <th>Thể loại</th>
                        <th>Số chương</th>
                        <th>Hành động</th>
                    </tr>
                </thead>

                <tbody id="mangaTable"></tbody>
            </table>
        </div>
    </div>

</div>

<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
