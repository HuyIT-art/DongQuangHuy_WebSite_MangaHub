<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Solo Leveling - Chương 1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap + FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS dùng chung -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navbar.css">

    <!-- CSS riêng cho đọc truyện -->
    <link rel="stylesheet" href="css/read.css">
    
</head>


<body>

<!-- Header -->
<header class="header">
    <a href="index.html" class="logo">Manga<span style="color:#fff;">Hub</span></a>
    <div class="search-box">
        <input type="text" placeholder="Tìm kiếm...">
        <i class="fas fa-search"></i>
    </div>
</header>

<!-- Nội dung đọc -->
<div class="container read-container">

    <!-- Tiêu đề -->
    <div class="read-header text-center">
        <h1 class="manga-name">Solo Leveling</h1>
        <h5 class="chapter-name">Chương 1: Người yếu nhất</h5>
    </div>

    <!-- Thanh điều hướng -->
<div class="read-navigation">
    <button class="btn btn-outline-secondary" id="prevChapter">
        <i class="fas fa-chevron-left"></i> Chương Trước
    </button>

    <a href="detail.html" class="btn btn-outline-primary">
        <i class="fas fa-list"></i> Danh Sách Chương
    </a>

    <button class="btn btn-outline-secondary" id="nextChapter">
        Chương Sau <i class="fas fa-chevron-right"></i>
    </button>
</div>


    <!-- ===================== -->
    <!-- NỘI DUNG ĐỌC TRUYỆN -->
    <!-- ===================== -->

        <!-- MỖI ẢNH LÀ 1 TRANG TRUYỆN -->
        <!-- SAU NÀY BẠN CHỈ VIỆC THAY SRC -->
<div class="read-content" id="readContent"></div>


        <!-- CHỖ NÀY CHÍNH LÀ NƠI BẠN CHÈN TƯ LIỆU ĐỌC -->
        <!-- CÓ BAO NHIÊU ẢNH -> THÊM BẤY NHIÊU <img> -->


    <!-- Thanh điều hướng dưới -->



</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Lấy chapter từ URL
    const params = new URLSearchParams(window.location.search);
    let currentChapter = parseInt(params.get("chapter")) || 1;

    const maxChapter = 179; // tổng số chương (bạn chỉnh)

    // Cập nhật tiêu đề chương
    document.querySelector(".chapter-name").innerText =
        "Chương " + currentChapter;

    // Nút chương trước
    document.getElementById("prevChapter").onclick = function () {
        if (currentChapter > 1) {
            window.location.href = `read.html?chapter=${currentChapter - 1}`;
        } else {
            alert("Đây là chương đầu tiên rồi!");
        }
    };

    // Nút chương sau
    document.getElementById("nextChapter").onclick = function () {
        if (currentChapter < maxChapter) {
            window.location.href = `read.html?chapter=${currentChapter + 1}`;
        } else {
            alert("Đây là chương cuối cùng!");
        }
    };
</script>
<script>
    const readContent = document.getElementById("readContent");
    const totalImages = 5;

    for (let i = 1; i <= totalImages; i++) {
        const img = document.createElement("img");
        img.src = `imagesread/chapter-${currentChapter}/${i}.jpg`;
        img.alt = `Trang ${i}`;
        readContent.appendChild(img);
    }
</script>
<!-- Lịch sử đọc -->
<script>
    // ====== LƯU LỊCH SỬ ĐỌC ======
    const currentUser = JSON.parse(localStorage.getItem("currentUser"));

    if (currentUser) {
        // Lấy id truyện từ URL detail -> read
        const urlParams = new URLSearchParams(window.location.search);
        const chapter = urlParams.get("chapter") || 1;

        // ⚠️ Thông tin truyện (bạn chỉnh theo từng truyện)
        const mangaData = {
            id: 3, // id của Solo Leveling (PHẢI TRÙNG detail.html?id=3)
            title: "Solo Leveling",
            image: "images/solo-leveling.jpg",
            lastReadChapter: chapter,
            lastReadAt: Date.now()
        };

        const historyKey = `history_${currentUser.email}`;
        let history = JSON.parse(localStorage.getItem(historyKey)) || [];

        // Kiểm tra đã có trong lịch sử chưa
        const index = history.findIndex(m => m.id === mangaData.id);

        if (index !== -1) {
            // Đã đọc rồi → cập nhật
            history[index].lastReadAt = mangaData.lastReadAt;
            history[index].lastReadChapter = chapter;
        } else {
            // Chưa có → thêm mới
            history.push(mangaData);
        }

        localStorage.setItem(historyKey, JSON.stringify(history));
    }
</script>


</body>
</html>
