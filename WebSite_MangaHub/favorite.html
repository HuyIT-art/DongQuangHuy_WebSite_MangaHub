<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Truyện Yêu Thích</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/navbar.css">
</head>

<body>

<header class="header">
    <a href="index.html" class="logo">Manga<span style="color:#fff;">Hub</span></a>
</header>

<div class="container" style="margin-top:100px;">
    <h2 class="mb-4"><i class="fa-brands fa-gratipay" style="color: #f91f1f;"></i> Truyện Yêu Thích</h2>

    <div id="favoriteList" class="row g-4"></div>
</div>

<script>
    const list = document.getElementById("favoriteList");
    const favorites = JSON.parse(localStorage.getItem("favorites")) || [];

    if (favorites.length === 0) {
        list.innerHTML = "<p>Bạn chưa yêu thích truyện nào.</p>";
    }

    favorites.forEach(manga => {
        const div = document.createElement("div");
        div.className = "col-md-3";

        div.innerHTML = `
            <div class="card h-100">
                <img src="${manga.cover}" class="card-img-top">
                <div class="card-body">
                    <h6 class="card-title">${manga.title}</h6>
                    <a href="${manga.link}" class="btn btn-sm btn-primary">Xem</a>
                </div>
            </div>
        `;

        list.appendChild(div);
    });
</script>

</body>
</html>
